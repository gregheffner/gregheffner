name: update-readme

# Refreshes the auto-updated README sections (latest blog posts, recently shipped PRs)
# and redraws the stats cards in stats/ (no third-party stats service).
# Commits only when the content actually changed.
on:
  schedule:
    - cron: "17 11 * * *"   # daily, 07:17 EDT
  workflow_dispatch:         # run by hand from the Actions tab
  repository_dispatch:
    types: [blog-published]  # lets blog-publish poke it right after a post goes live

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refresh sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update_readme.py
          python3 scripts/make_stats.py

      - name: Commit if changed
        run: |
          if git diff --quiet README.md stats && [ -z "$(git ls-files --others stats)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md stats
          git commit -m "readme: refresh latest posts, shipped work and stats"
          git push
